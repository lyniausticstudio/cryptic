      Backdrop-filter: blur(16px);
      Border: 1px solid rgba(255, 255, 255, 0.08);

    }

    .gold-border {
      Border-color: rgba(245, 158, 11, 0.35);
    }

    .glow-gold {

    }
    
    .glow-emerald {
      Box-shadow: 0 0 30px -5px rgba(16, 185, 129, 0.4);
    }

    /* Error Shake */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
