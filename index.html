<!-- 引入外部獨立的題目資料庫 -->
  <script src="puzzles-db.js"></script>

  <!-- ================= JAVASCRIPT GAME LOGIC ================= -->
  <script>
    let currentPuzzleIndex = 0;
    let timerInterval = null;
    let timerSeconds = 0;
    let revealedHintsCount = 0;
    let isSolved = false;

    window.addEventListener('DOMContentLoaded', () => {
      loadPuzzleForToday();
      renderArchiveList();
      startMidnightCountdown();
    });

    function loadPuzzleForToday() {
      const todayStr = new Date().toISOString().split('T')[0];
      const foundIndex = PUZZLE_DATABASE.findIndex(p => p.date === todayStr);
      currentPuzzleIndex = foundIndex !== -1 ? foundIndex : 0;
      updateHomeView();
    }

    function updateHomeView() {
      if (!PUZZLE_DATABASE || PUZZLE_DATABASE.length === 0) return;
      const p = PUZZLE_DATABASE[currentPuzzleIndex];
      if (!p) return;

      const issueEl = document.getElementById('home-issue-tag');
      if (issueEl) issueEl.innerText = `題目 #${p.id}`;

      const dateEl = document.getElementById('home-date-tag');
      if (dateEl) dateEl.innerText = p.date;

      const clueEl = document.getElementById('home-clue-text');
      if (clueEl) clueEl.innerText = p.clue;

      const lengthEl = document.getElementById('home-length-tag');
      if (lengthEl) lengthEl.innerText = `(${p.length}字)`;

      const grid = document.getElementById('home-character-grid');
      if (grid) {
        grid.innerHTML = '';
        for(let i=0; i<p.length; i++) {
          const box = document.createElement('div');
          box.className = 'w-7 h-8 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center text-xs font-mono text-slate-500';
          box.innerText = '？';
          grid.appendChild(box);
        }
      }
    }

    function switchView(viewName) {
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-game').classList.add('hidden');

      if(viewName === 'home') {
        document.getElementById('view-home').classList.remove('hidden');
        stopTimer();
      } else if(viewName === 'game') {
        document.getElementById('view-game').classList.remove('hidden');
        initGameSession();
      }
    }

    function startGameplay() {
      switchView('game');
    }

    function initGameSession() {
      const p = PUZZLE_DATABASE[currentPuzzleIndex];
      isSolved = false;
      revealedHintsCount = 0;
      document.getElementById('game-issue-badge').innerText = `題目 #${p.id}`;
      document.getElementById('game-clue-text').innerText = p.clue;
      document.getElementById('game-word-length-label').innerText = `(解答字數: ${p.length} 字)`;
      document.getElementById('game-feedback-msg').innerText = '';
      document.getElementById('game-input-card').classList.remove('animate-success-pulse');

      const container = document.getElementById('game-inputs-container');
      container.innerHTML = '';
      for(let i=0; i<p.length; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 1;
        input.className = 'char-input w-12 h-14 text-center text-xl font-bold bg-slate-950 border border-slate-800 text-white rounded-xl focus:border-amber-500 focus:outline-none transition';
        input.dataset.index = i;
        
        input.addEventListener('input', (e) => {
          if(e.target.value.length === 1) {
            const next = container.querySelector(`[data-index="${i+1}"]`);
            if(next) next.focus();
          }
        });
        container.appendChild(input);
      }

      renderHintsDrawer(p);

      stopTimer();
      timerSeconds = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function renderHintsDrawer(p) {
      const container = document.getElementById('game-hints-container');
      container.innerHTML = '';

      let zParts = p.zhuyin.trim().split(/\s+/);
      if (zParts.length < p.length) {
        zParts = [p.zhuyin];
      }

      const totalHints = p.hints.length + zParts.length;
      document.getElementById('game-hint-count-text').innerText = `0 / ${totalHints}`;

      let globalIndex = 0;

      p.hints.forEach((hint) => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-xl p-4 border-slate-800/80 flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold text-amber-400">${globalIndex + 1}. ${hint.title}</span>
              <span id="badge-hint-${globalIndex}" class="text-[10px] px-2 py-0.5 rounded bg-slate-900 text-slate-500 font-mono">未揭示</span>
            </div>
          </div>
          <div id="content-hint-${globalIndex}" class="hidden text-xs font-bold text-amber-300 bg-slate-950 p-2.5 rounded border border-amber-500/30 my-2">${hint.content}</div>
          <button id="btn-hint-${globalIndex}" onclick="revealHint(${globalIndex})" class="w-full py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 text-xs font-semibold transition">
            開啟提示 (+1)
          </button>
        `;
        container.appendChild(card);
        globalIndex++;
      });

      zParts.forEach((zPart, zIdx) => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-xl p-4 border-slate-800/80 flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold text-violet-400">${globalIndex + 1}. 發音提示 (第 ${zIdx + 1} 字)</span>
              <span id="badge-hint-${globalIndex}" class="text-[10px] px-2 py-0.5 rounded bg-slate-900 text-slate-500 font-mono">未揭示</span>
            </div>
          </div>
          <div id="content-hint-${globalIndex}" class="hidden text-xs font-bold text-violet-300 bg-slate-950 p-2.5 rounded border border-violet-500/30 my-2">${zPart}</div>
          <button id="btn-hint-${globalIndex}" onclick="revealHint(${globalIndex})" class="w-full py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 text-xs font-semibold transition">
            開啟提示 (+1)
          </button>
        `;
        container.appendChild(card);
        globalIndex++;
      });
    }

    function revealHint(idx) {
      document.getElementById(`content-hint-${idx}`).classList.remove('hidden');
      const btn = document.getElementById(`btn-hint-${idx}`);
      if(btn) btn.remove();
      const badge = document.getElementById(`badge-hint-${idx}`);
      badge.innerText = '已揭示';
      badge.className = 'text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 font-mono';
      
      revealedHintsCount++;
      const p = PUZZLE_DATABASE[currentPuzzleIndex];
      let zParts = p.zhuyin.trim().split(/\s+/);
      if (zParts.length < p.length) zParts = [p.zhuyin];
      const totalHints = p.hints.length + zParts.length;
      document.getElementById('game-hint-count-text').innerText = `${revealedHintsCount} / ${totalHints}`;
    }

    function submitAnswerCheck() {
      if (isSolved) return;
      const p = PUZZLE_DATABASE[currentPuzzleIndex];
      const inputs = document.querySelectorAll('.char-input');
      let userAns = '';
      inputs.forEach(inp => userAns += inp.value.trim());

      const feedback = document.getElementById('game-feedback-msg');
      const card = document.getElementById('game-input-card');

      if(userAns === p.answer) {
        isSolved = true;
        stopTimer();
        feedback.className = 'text-xs font-bold text-emerald-400 min-h-[18px]';
        feedback.innerHTML = `<i class="fa-solid fa-circle-check"></i> 解答正確！解析：${p.explanation}`;
        card.classList.add('animate-success-pulse');
        
        if(typeof confetti === 'function') {
          confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }
      } else {
        feedback.className = 'text-xs font-bold text-rose-400 min-h-[18px]';
        feedback.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> 答案不正確，請再試一次！`;
        card.classList.add('animate-shake');
        setTimeout(() => card.classList.remove('animate-shake'), 400);
      }
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('game-timer-text').innerText = `${m}:${s}`;
    }

    function stopTimer() {
      if(timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('puzzle-list-archive');
      listContainer.innerHTML = '';
      PUZZLE_DATABASE.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-900/80 hover:bg-slate-900 border border-slate-800 cursor-pointer transition';
        item.onclick = () => {
          currentPuzzleIndex = idx;
          updateHomeView();
          toggleModal('calendar-modal');
        };
        item.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span class="text-xs font-bold text-white">題目 #${p.id}：${p.clue}</span>
          </div>
          <span class="text-[11px] text-slate-400 font-mono">${p.date}</span>
        `;
        listContainer.appendChild(item);
      });
    }

    function onDateSelected(dateStr) {
      const foundIdx = PUZZLE_DATABASE.findIndex(p => p.date === dateStr);
      if(foundIdx !== -1) {
        currentPuzzleIndex = foundIdx;
        updateHomeView();
        toggleModal('calendar-modal');
      } else {
        alert('該日期尚無題目解鎖！');
      }
    }

    function toggleModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.toggle('hidden');
    }

    function startMidnightCountdown() {
      const countdownEl = document.getElementById('midnight-countdown');
      setInterval(() => {
        const now = new Date();
        const midnight = new Date();
        midnight.setHours(24, 0, 0, 0);
        const diff = midnight - now;

        const h = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
        const m = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
        const s = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
        countdownEl.innerText = `${h}:${m}:${s}`;
      }, 1000);
    }
  </script>
